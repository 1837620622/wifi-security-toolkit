<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-label="Pipeline">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="220" rx="16" fill="url(#pbg)" stroke="#1e293b"/>
  <text x="28" y="36" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" letter-spacing="1.5">SYSTEM PIPELINE</text>

  <!-- stages -->
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <g transform="translate(36,70)">
      <rect width="170" height="100" rx="12" fill="#0b1220" stroke="#0ea5e9" stroke-width="1.5"/>
      <text x="85" y="38" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="600">01 · Capture</text>
      <text x="85" y="60" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">空口捕获</text>
      <text x="85" y="82" text-anchor="middle" fill="#64748b" font-size="11">Monitor · Deauth</text>
    </g>
    <line x1="216" y1="120" x2="248" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(258,70)">
      <rect width="170" height="100" rx="12" fill="#0b1220" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="85" y="38" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="600">02 · Normalize</text>
      <text x="85" y="60" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">证据规范化</text>
      <text x="85" y="82" text-anchor="middle" fill="#64748b" font-size="11">EAPOL → 22000</text>
    </g>
    <line x1="438" y1="120" x2="470" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(480,70)">
      <rect width="170" height="100" rx="12" fill="#0b1220" stroke="#818cf8" stroke-width="1.5"/>
      <text x="85" y="38" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="600">03 · Search</text>
      <text x="85" y="60" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">离线搜索</text>
      <text x="85" y="82" text-anchor="middle" fill="#64748b" font-size="11">dict · rule · mask</text>
    </g>
    <line x1="660" y1="120" x2="692" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(702,70)">
      <rect width="220" height="100" rx="12" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
      <text x="110" y="38" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="600">04 · Verify</text>
      <text x="110" y="60" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">校验与回收</text>
      <text x="110" y="82" text-anchor="middle" fill="#64748b" font-size="11">MIC / PMKID · potfile</text>
    </g>
  </g>
</svg>
