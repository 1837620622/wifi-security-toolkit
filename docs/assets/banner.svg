<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="WiFi Security Toolkit">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)" opacity="0.55"/>
  <path d="M0 210 C200 170 350 240 520 190 S850 140 1200 180 L1200 280 L0 280 Z" fill="#0ea5e9" opacity="0.06"/>
  <path d="M0 230 C280 200 480 250 700 210 S1000 180 1200 220" fill="none" stroke="url(#line)" stroke-width="2"/>

  <!-- concentric wifi arcs -->
  <g transform="translate(160,140)" fill="none" stroke="url(#accent)" stroke-linecap="round">
    <path d="M-18 18 a26 26 0 0 1 36 0" stroke-width="4" opacity="0.95"/>
    <path d="M-34 2 a48 48 0 0 1 68 0" stroke-width="3.5" opacity="0.7"/>
    <path d="M-50 -14 a70 70 0 0 1 100 0" stroke-width="3" opacity="0.45"/>
    <path d="M-66 -30 a92 92 0 0 1 132 0" stroke-width="2.5" opacity="0.28"/>
    <circle cx="0" cy="32" r="5" fill="#38bdf8"/>
  </g>

  <!-- lock node -->
  <g transform="translate(980,92)">
    <rect x="0" y="28" width="56" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M12 28 v-10 a16 16 0 0 1 32 0 v10" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="50" r="4" fill="#22d3ee"/>
  </g>

  <text x="280" y="118" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5">WiFi Security Toolkit</text>
  <text x="280" y="158" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">WPA/WPA2 Assessment Pipeline · CN-Optimized Offline Analysis</text>
  <text x="280" y="198" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">Capture · Normalize · Search · Verify  ·  抓包 · 规范化 · 搜索 · 校验</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#cbd5e1">
    <rect x="280" y="220" width="92" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
    <text x="326" y="237" text-anchor="middle">Scapy</text>
    <rect x="382" y="220" width="100" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
    <text x="432" y="237" text-anchor="middle">hashcat</text>
    <rect x="492" y="220" width="88" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
    <text x="536" y="237" text-anchor="middle">EAPOL</text>
    <rect x="590" y="220" width="120" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
    <text x="650" y="237" text-anchor="middle">mode 22000</text>
  </g>
</svg>
